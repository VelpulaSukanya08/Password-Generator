<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator Pro V3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🔐 Password Generator Pro</h1>

    <div class="password-box">
        <input type="password" id="password" placeholder="Click Generate">
        <button id="showBtn" onclick="togglePassword()">👁️</button>
    </div>

    <div class="slider-box">
        <label>Password Length :
            <span id="lengthValue">12</span>
        </label>

        <input
            type="range"
            id="length"
            min="6"
            max="30"
            value="12">
    </div>

    <div class="options">

        <label><input type="checkbox" id="uppercase" checked> Uppercase</label>

        <label><input type="checkbox" id="lowercase" checked> Lowercase</label>

        <label><input type="checkbox" id="numbers" checked> Numbers</label>

        <label><input type="checkbox" id="symbols" checked> Symbols</label>

    </div>

    <div class="strength">

        <div class="bar">
            <div id="strengthBar"></div>
        </div>

        <p id="strengthText">Password Strength</p>

    </div>

    <button class="generate" onclick="generatePassword()">
        🎲 Generate Password
    </button>

    <button id="copyBtn" class="copy" onclick="copyPassword()">
        📋 Copy Password
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
